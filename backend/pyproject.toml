[project]
name = "ai-incident-investigator-v2"
version = "0.1.0"
description = "AI Incident Investigator v2 Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "langgraph",
    "langchain-core",
    "langchain-google-genai",
    "sentence-transformers",
    "rank_bm25",
    "pyjwt",
    "cryptography",
    "detect-secrets",
    "PyGithub",
    "psycopg2-binary",
    "pgvector",
    "httpx",
    "apscheduler",
    "python-multipart",
    "aiofiles",
    "sqlalchemy",
    "alembic",
    "bcrypt",
    "python-dotenv",
    "pymongo"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
